<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course page options prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
:root { --purple-dark: #291647; --purple-light: #c68efd; --purple-line: #d9cbee; --grey: #f4f4f4; --muted: #4a3a63; --lime: #d4ef70; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--grey); color: var(--purple-dark); font-family: Figtree, sans-serif; }
a { color: var(--purple-dark); }
.proto-controls { width: min(1280px, 100%); margin: 0 auto; padding: 24px 16px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 1312px) { .proto-controls { padding-left: 0; padding-right: 0; } }
@media (min-width: 768px) { #app { display: flex; flex-direction: column; height: 100vh; } .viewport { flex: 1 1 auto; min-height: 0; max-height: 832px; } }
.viewport { width: min(1280px, 100%); height: 832px; margin: 0 auto 24px; overflow-y: auto; background: #fff; border: 1px solid var(--purple-line); border-radius: 12px; box-shadow: 0 8px 24px rgba(41, 22, 71, 0.10); }
.wrap { padding: 40px; display: flex; flex-direction: column; gap: 28px; }
@media (max-width: 767px) { .viewport { height: auto; overflow: visible; border: 0; border-radius: 0; box-shadow: none; margin-bottom: 0; } .wrap { padding: 24px 16px; } }
.level { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.level label { font-size: 15px; font-weight: 600; }
.level select { min-height: 48px; min-width: min(320px, 100%); padding: 0 16px; border: 2px solid var(--purple-dark); border-radius: 5px; background: #fff; color: var(--purple-dark); font: 600 16px Figtree, sans-serif; cursor: pointer; }
.level span { font-size: 14px; color: var(--muted); }
.url { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: #fff; border-radius: 8px; font-size: 14px; overflow-wrap: anywhere; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(32px, 5vw, 46px); font-weight: 500; line-height: 1.15; }
.panels { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
@media (min-width: 900px) { .panels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opts { display: flex; flex-direction: column; gap: 22px; padding: 30px; background: var(--grey); border-radius: 15px; }
.facts-panel { display: flex; flex-direction: column; gap: 26px; padding: 30px; background: #fff; border: 1px solid var(--purple-line); border-radius: 15px; }
h2 { margin: 0; font-size: 20px; font-weight: 600; }
fieldset { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
legend { padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 600; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.optbar { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--purple-line); border-radius: 15px; }
.optbar-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 14px 20px; }
.optbar-summary { display: flex; flex-direction: column; gap: 2px; flex: 1 1 260px; min-width: 0; }
.optbar-summary span { font-size: 12px; font-weight: 500; color: var(--muted); }
.optbar-summary strong { font-size: 16px; font-weight: 600; line-height: 1.35; }
.optbar-toggle { flex-shrink: 0; min-height: 44px; padding: 0 18px; border: 2px solid var(--purple-dark); border-radius: 5px; background: #fff; color: var(--purple-dark); font: 600 15px Figtree, sans-serif; cursor: pointer; }
.optbar .cta, .pinbar .cta { flex-shrink: 0; min-height: 44px; font-size: 15px; padding: 0 20px; }
.drawer { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-top: 1px solid var(--purple-line); }
.pinbar { position: sticky; bottom: 0; z-index: 10; display: flex; flex-direction: column; background: #fff; border-top: 1px solid var(--purple-line); box-shadow: 0 -6px 16px rgba(41, 22, 71, 0.10); }
.pinbar-drawer { display: flex; flex-direction: column; gap: 16px; max-height: 520px; overflow-y: auto; padding: 20px 24px; background: var(--purple-dark); color: #fff; border-bottom: 1px solid var(--muted); }
.pinbar-drawer .note { color: var(--purple-light); }
.pinbar-row { display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: var(--purple-dark); color: #fff; }
.pinbar .optbar-toggle { background: transparent; border-color: #fff; color: #fff; }
.pinbar .cta-primary { background: var(--purple-light); color: var(--purple-dark); }
.pinbar-summary { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.pinbar-summary span { font-size: 13px; font-weight: 500; color: var(--purple-light); margin-right: 6px; }
@media (max-width: 899px) { .drawer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }
@media (max-width: 767px) {
  .drawer-grid { grid-template-columns: 1fr !important; }
  .pinbar-row { flex-wrap: wrap; gap: 10px; padding: 12px 16px 16px; }
  .pinbar-summary { flex-basis: 100%; white-space: normal; }
  .pinbar .optbar-toggle, .pinbar .cta { flex: 1 1 0; justify-content: center; text-align: center; font-size: 14px; padding: 0 10px; }
  .pinbar-drawer { max-height: 60vh; padding: 16px; }
}

.note { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 22px 24px; }
dt { font-size: 13px; color: var(--muted); }
dd { margin: 4px 0 0; font-size: 17px; font-weight: 600; line-height: 1.35; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; }
.cta { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 5px; font-size: 16px; font-weight: 600; text-decoration: none; }
.cta-primary { background: var(--purple-dark); color: #fff; }
.cta-secondary { background: var(--purple-light); color: var(--purple-dark); }
.content { display: flex; flex-direction: column; gap: 12px; }
.content > h2 { font-size: 24px; padding-top: 8px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.sec-head h3 { margin: 0; font-size: 18px; font-weight: 600; }
.rule { display: grid; grid-template-columns: 1fr; gap: 6px 20px; align-items: start; }
@media (min-width: 768px) { .rule { grid-template-columns: 180px minmax(0, 1fr); } }
.rule > p { margin: 0; font-size: 14px; font-weight: 600; }
@media (min-width: 768px) { .rule > p { padding-top: 10px; } }
.cases { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 767px) { .cases > div { grid-template-columns: 1fr !important; gap: 4px !important; } }
.foot { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>
<script>
// Minimal stand-in for the design canvas runtime: same component logic, rendered with plain JavaScript.
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { Object.assign(this.state, patch); render(); }
}

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
level: 'ug',
ug: { fee: 'home', route: 'std', place: 'none', start: 'sep' },
pgt: { fee: 'home', award: 'msc', mode: 'ft' },
pgr: { fee: 'home', mode: 'ft' },
app: { who: 'employer', start: 'sep' },
short: { start: 'oct25' }
};
}
renderVals() {
const lvl = this.state.level;
const S = this.state[lvl];
const P = 'Proposal', C = 'To confirm';
const tagBase = 'display: inline-flex; align-items: center; flex-shrink: 0; min-height: 22px; padding: 0 9px; border-radius: 11px; color: #291647; font-size: 12px; font-weight: 600; white-space: nowrap;';
const tagStyle = (t) => t === C ? tagBase + ' background: #d4ef70;' : 'display: none;';
const base = 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 10px 14px; box-sizing: border-box; border-radius: 5px; font-family: Figtree, sans-serif; font-size: 15px; text-align: left; cursor: pointer;';
const on = base + ' background: #c68efd; border: 2px solid #c68efd; color: #291647; font-weight: 600;';
const off = base + ' background: transparent; border: 2px solid #8a7aa3; color: #ffffff; font-weight: 500;';
const radio = (sel) => 'display: inline-block; flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; background: #ffffff; ' + (sel ? 'border: 5px solid #291647;' : 'border: 2px solid #ffffff; background: transparent;');
const group = (cur, key, label, opts, note, tag) => ({
label: label, note: note || '', hasNote: !!note, tag: tag === C ? C : '', tagStyle: tagStyle(tag),
options: opts.map((o) => ({
label: o[1], sub: o[2] || '', dot: radio(cur[key] === o[0]),
pressed: cur[key] === o[0] ? 'true' : 'false',
style: cur[key] === o[0] ? on : off,
pick: () => this.setState({ [lvl]: Object.assign({}, this.state[lvl], { [key]: o[0] }), last: label })
}))
});
const fact = (label, value, tag) => ({ label: label, value: value, tag: tag === C ? C : '', tagStyle: tagStyle(tag) });
const rule = (label, current, cases) => ({ label: label, current: current, cases: cases });
const sec = (name, rules, hidden) => ({ name: name, rules: rules, hidden: !!hidden });
const homeLabel = 'UK, Channel Islands, Isle of Man or Ireland';
let v, secs = [];

if (lvl === 'ug') {
const intl = S.fee === 'intl', fy = S.route === 'fy', place = S.place === 'yes';
let st = S.start;
if (fy && st !== 'sep') st = 'sep';
const clr = st === 'clr', jan = st === 'jan';
const cur = { fee: S.fee, route: S.route, place: S.place, start: st };
const startOpts = [['sep', 'September']];
if (!fy) { startOpts.push(['jan', 'January', 'Ends in May, 2 years 4 months later']); startOpts.unshift(['clr', 'Clearing 2026', 'Open now']); }
const groups = [
group(cur, 'fee', 'Fee status', [['home', homeLabel], ['intl', 'International']]),
group(cur, 'route', 'Route', [['std', 'Standard', 'UCAS code NP29'], ['fy', 'With foundation year', 'UCAS code NP2X, +1 year']], 'Each route is its own course page with its own UCAS code.'),
group(cur, 'place', 'Industry placement', [['none', 'No placement'], ['yes', 'Sandwich year', '+1 year, between years 2 and 3']], 'Same course page and UCAS code: it only changes the course length.'),
group(cur, 'start', 'Start date', startOpts, fy ? 'The foundation year page lists a September start only, and no Clearing.' : (clr && intl ? 'To confirm: whether international applicants can apply through Clearing.' : ''), clr && intl ? C : '')
];
let length, lengthTag = '';
if (jan) { length = place ? '[January start with a placement year]' : '2 years 4 months full-time'; if (place) lengthTag = C; }
else length = ((fy ? 4 : 3) + (place ? 1 : 0)) + ' years ' + (place ? 'sandwich' : 'full-time');
let fees, feesTag = '';
if (clr) { fees = '[2026/27 fee]'; feesTag = C; }
else if (fy) { fees = intl ? '[International foundation year fee]' : 'From £5,760 (foundation year)'; if (intl) feesTag = C; }
else fees = intl ? '£16,700 a year (2027/28)' : 'From £10,050 a year (2027/28)';
if (place) { fees += ', plus [placement year fee]'; feesTag = C; }
const offer = clr ? 'Below 104 points considered individually' : (fy ? '48 UCAS points' : '104 to 120 UCAS points');
let cta = intl ? 'Apply now (for International students)' : 'Apply now (for UK students)';
let cta2 = 'Book an open day';
let ctaNote = intl ? 'Goes to Oxford International (oxfordinternational.com).' : 'Goes to this route’s course page on UCAS.';
if (clr && !intl) { cta = 'Call 01962 827234'; cta2 = 'WhatsApp 07447 197168'; ctaNote = 'The live page gives a phone number and WhatsApp for Clearing, alongside the UCAS button.'; }
v = {
example: 'BA (Hons) Business Management',
path: fy ? '/study/foundation-year/Courses/BA-Hons-Business-Management-with-Foundation-Year/' : '/study/undergraduate/courses/ba-hons-business-management/',
award: 'BA (Hons)', title: fy ? 'Business Management (with Foundation Year)' : 'Business Management', groups: groups,
fixed: 'Location is the same for every option on this course (on campus), so it is shown as a fact, not an option.', hasFixed: true,
facts: [
fact('UCAS code', fy ? 'NP2X' : 'NP29'),
fact('Course length', length, lengthTag),
fact('Start date', clr ? '[Clearing 2026 start date]' : (jan ? 'January' : 'September'), clr ? C : ''),
fact('Location', 'On campus'),
fact('Typical offer', offer),
fact('Fees', fees, feesTag)
],
cta: cta, cta2: cta2, ctaNote: ctaNote
};
const feeR = (h, i) => rule('Fee status', S.fee, [['home', homeLabel, h[0], h[1]], ['intl', 'International', i[0], i[1]]]);
const routeR = (s, f) => rule('Route', S.route, [['std', 'Standard', s[0], s[1]], ['fy', 'With foundation year', f[0], f[1]]]);
const placeR = (n, y) => rule('Industry placement', S.place, [['none', 'No placement', n[0], n[1]], ['yes', 'Sandwich year', y[0], y[1]]]);
const startR = (c, s, j) => rule('Start date', st, [['clr', 'Clearing 2026', c[0], c[1]], ['sep', 'September', s[0], s[1]], ['jan', 'January', j[0], j[1]]]);
secs = [
sec('Clearing alert', [startR(['Alert shown: “this course is available through Clearing”, call 01962 827234'], ['No alert'], ['No alert'])], !clr),
sec('Course modules', [routeR(['Years 1 to 3'], ['Foundation Year (optional 120 credits) item shown before Year 1']), placeR(['No placement year item'], ['Placement year shown between Years 2 and 3', P])]),
sec('Study hours and assessment', [routeR(['Years 1 to 3'], ['Year 0 (Level 3) text and table row shown'])]),
sec('Entry requirements', [feeR(['UK tab opens first', P], ['International tab opens first', P]), routeR(['104 to 120 UCAS points'], ['48 UCAS points']), startR(['Below 104 points considered individually'], ['Typical offer'], ['Typical offer'])]),
sec('Pathways Programme', [feeR(['Shown'], ['Hidden. The live page says the programme is open to home and Channel Islands Year 12 and 13 students', P])], intl),
sec('How much will university cost me?', [feeR(['UK tuition fee: £10,050 a year (2027/28)'], ['International tuition fee: £16,700 a year (2027/28)']), routeR(['No foundation year fee'], ['Foundation year fee: from £5,760 (UK)']), placeR(['No placement year fee'], ['[Placement year fee]', C]), startR(['[2026/27 fees]', C], ['2027/28 fees'], ['2027/28 fees'])]),
sec('Discover Uni', [routeR(['Statistics for NP29', P], ['Statistics for NP2X', P])]),
sec('Compare related courses', [routeR(['Course cards open on the Undergraduate tab', P], ['Course cards open on the Foundation tab', P])])
];
}

if (lvl === 'pgt') {
const intl = S.fee === 'intl', pt = S.mode === 'pt', msc = S.award === 'msc';
const awardName = { msc: 'MSc', pgdip: 'PgDip', pgcert: 'PgCert' }[S.award];
const groups = [
group(S, 'fee', 'Fee status', [['home', homeLabel], ['intl', 'International']]),
group(S, 'award', 'Award', [['msc', 'MSc', '180 credits'], ['pgdip', 'PgDip'], ['pgcert', 'PgCert']], 'The live course page offers the MSc only. To confirm whether a PgDip or PgCert can be studied on its own.', P),
group(S, 'mode', 'Mode', [['ft', 'Full-time'], ['pt', 'Part-time']], intl ? 'To confirm: whether international students can study part-time.' : '', intl ? C : '')
];
let length, lengthTag = '';
if (msc) length = pt ? '2 years part-time' : '1 year full-time';
else { length = '[' + awardName + ' length]'; lengthTag = C; }
let fees = '[' + (pt ? 'Part-time ' : '') + awardName + ' fee]', feesTag = C;
if (msc && !pt) { fees = intl ? '£17,450 (2027/28)' : '£10,050 (2027/28)'; feesTag = ''; }
v = {
example: 'MSc Digital Marketing and Analytics',
path: '/study/Postgraduate/Courses/MSc-Digital-Marketing-and-Analytics/',
award: awardName, title: 'Digital Marketing and Analytics', groups: groups,
fixed: 'Start date (September) and location (on campus) are the same for every option on this course, so they are shown as facts. Some other courses are distance learning only.', hasFixed: true,
facts: [
fact('Course start date', 'September'),
fact('Course length', length, lengthTag),
fact('Location', 'On campus, Winchester'),
fact('Typical offer', 'A first or second-class honours degree'),
fact('Fees', fees, feesTag),
fact('Credits', msc ? '180' : '[' + awardName + ' credits]', msc ? '' : C)
],
cta: intl ? 'Apply now (for International students)' : 'Apply now (for UK students)',
cta2: 'How to apply',
ctaNote: intl ? 'Goes to Oxford International (oxfordinternational.com).' : 'Goes to the postgraduate how to apply page.'
};
const feeR = (h, i) => rule('Fee status', S.fee, [['home', homeLabel, h[0], h[1]], ['intl', 'International', i[0], i[1]]]);
const awardR = (m, d, c) => rule('Award', S.award, [['msc', 'MSc', m[0], m[1]], ['pgdip', 'PgDip', d[0], d[1]], ['pgcert', 'PgCert', c[0], c[1]]]);
const modeR = (f, p) => rule('Mode', S.mode, [['ft', 'Full-time', f[0], f[1]], ['pt', 'Part-time', p[0], p[1]]]);
secs = [
sec('Modules', [awardR(['All modules (180 credits)'], ['[PgDip modules]', C], ['[PgCert modules]', C])]),
sec('Entry requirements', [feeR(['A first or second-class honours degree', P], ['IELTS 6.0 overall, 5.5 in writing, and the International Recruitment Team contact', P])]),
sec('Tuition fees', [feeR(['UK fee: £10,050 (2027/28)'], ['International fee: £17,450 (2027/28)']), modeR(['Full-time fee'], ['[Part-time fee]', C]), awardR(['MSc fee'], ['[PgDip fee]', C], ['[PgCert fee]', C])]),
sec('Information for International Students', [feeR(['Hidden', P], ['Shown: country-specific entry requirements and funding information'])], !intl)
];
}

if (lvl === 'pgr') {
const intl = S.fee === 'intl', ft = S.mode === 'ft';
const tier = { home: 'UK or Ireland', ci: 'Channel Islands or Isle of Man', intl: 'International' };
const groups = [
group(S, 'fee', 'Fee status', [['home', tier.home], ['ci', tier.ci], ['intl', tier.intl]], 'The live fees table has three fee columns.'),
group(S, 'mode', 'Mode', [['ft', 'Full-time'], ['pt', 'Part-time']])
];
let fee = { home: ft ? '£5,006' : '£2,503', intl: ft ? '£16,700' : '£8,350' }[S.fee];
v = {
example: 'MPhil/PhD Research',
path: '/study/research-degrees/Courses/MPhilPhD-Research/',
award: 'Research degree', title: 'MPhil/PhD Research', groups: groups,
fixed: 'Start date (September) and location (on campus) are the same for every option, and MPhil and PhD share one page, so none of these are options.', hasFixed: true,
facts: [
fact('Course start date', 'September'),
fact('Course length', ft ? '4 years full-time (maximum). The fees table says 3' : '7 years part-time (maximum). The fees table says 6', C),
fact('Location', 'On campus, Winchester'),
fact('Fees', S.fee === 'ci' ? '[Channel Islands or Isle of Man fee]' : fee + ' a year (2026/27)', S.fee === 'ci' ? C : ''),
fact('Preparation for Research', '£1,400 one-off fee')
],
cta: 'Apply now', cta2: intl ? 'International Apply Page' : 'Find out how to apply',
ctaNote: 'Goes to the research degree how to apply page.'
};
const feeR = (h, c, i) => rule('Fee status', S.fee, [['home', tier.home, h[0], h[1]], ['ci', tier.ci, c[0], c[1]], ['intl', tier.intl, i[0], i[1]]]);
const modeR = (f, p) => rule('Mode', S.mode, [['ft', 'Full-time', f[0], f[1]], ['pt', 'Part-time', p[0], p[1]]]);
secs = [
sec('Application process', [feeR(['International Apply Page link hidden', P], ['International Apply Page link hidden', P], ['International Apply Page link shown'])]),
sec('Fees', [feeR(['£5,006 full-time, £2,503 part-time (2026/27)'], ['[Fee: no figure on the live page]', C], ['£16,700 full-time, £8,350 part-time (2026/27)']), modeR(['Full-time row'], ['Part-time row'])])
];
}

if (lvl === 'app') {
const emp = S.who === 'employer';
const groups = [
group(S, 'who', 'I am', [['employer', 'An employer'], ['apprentice', 'An apprentice or future apprentice']], 'The live page shows the costs for apprentices and for employers together.', P),
group(S, 'start', 'Start date', [['sep', 'September'], ['jan', 'January']], 'The live page lists September in its key facts, but January and September in its course details.', C)
];
v = {
example: 'MA (Hons) Social Work (Apprenticeship)',
path: '/study/Apprenticeships/Degree-Apprenticeship-Programmes/MA-Hons-Social-Work-Apprenticeship/',
award: 'MA (Hons)', title: 'Social Work (Apprenticeship)', groups: groups,
fixed: 'Each apprenticeship has its own page at one level. Social Work has separate BA and MA apprenticeship pages.', hasFixed: true,
facts: [
fact('Course start date', S.start === 'sep' ? 'September' : 'January', C),
fact('Course length', '2 years part-time'),
fact(emp ? 'Costs to employers' : 'Costs to apprentices', emp ? 'Funding depends on the number of people you employ, your payroll and the learner’s age' : 'No tuition fees. Apprentices are paid, with time off to study'),
fact('Entry requirements', 'A relevant first degree or equivalent Level 6 study, plus significant social work or care experience'),
fact('Course enquiries', '+44 (0) 1962 827234')
],
cta: emp ? 'Information for employers' : 'What are Degree Apprenticeships?',
cta2: emp ? 'What are Degree Apprenticeships?' : '',
ctaNote: 'The live page has no apply button. Apprentices apply for a job with a partner employer, or ask their employer to support them.'
};
const whoR = (e, a) => rule('I am', S.who, [['employer', 'An employer', e[0], e[1]], ['apprentice', 'An apprentice', a[0], a[1]]]);
secs = [
sec('Costs to Student/Apprentice', [whoR(['Hidden', P], ['Shown'])], emp),
sec('Costs to Employers', [whoR(['Shown'], ['Hidden', P])], !emp)
];
}

if (lvl === 'short') {
const dates = { oct25: 'October 2025', feb26: 'February 2026', jun26: 'June 2026' };
const groups = [
group(S, 'start', 'Start date', [['oct25', dates.oct25], ['feb26', dates.feb26], ['jun26', dates.jun26]], 'These are the start dates the live page lists, including past ones.')
];
v = {
example: 'An Introduction to Global Health',
path: '/study/Short-courses/Courses/An-Introduction-to-Global-Health/',
award: 'Short course', title: 'An Introduction to Global Health', groups: groups,
fixed: 'The live page lists one fee and distance learning only, so neither is an option.', hasFixed: true,
facts: [
fact('Course start date', dates[S.start]),
fact('Course length', '10 hours'),
fact('Location', 'Distance learning only'),
fact('Fees', '£150'),
fact('Typical offer', 'Health professionals')
],
cta: 'Apply now', cta2: '',
ctaNote: 'Goes to the University’s online store.'
};
secs = [
sec('Book now', [rule('Start date', S.start, [['oct25', dates.oct25, 'Books the ' + dates.oct25 + ' run', P], ['feb26', dates.feb26, 'Books the ' + dates.feb26 + ' run', P], ['jun26', dates.jun26, 'Books the ' + dates.jun26 + ' run', P]])])
];
}

const last = this.state.last;
const boxBase = 'display: flex; flex-direction: column; gap: 14px; padding: 22px 26px; border-radius: 15px; box-sizing: border-box;';
const badgeBase = 'display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 14px; font-size: 13px; font-weight: 600;';
const caseBase = 'display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; padding: 10px 14px; border-radius: 5px; font-size: 14px; line-height: 1.45;';
v.hasCta2 = !!v.cta2;
v.summary = v.groups.map((g) => { const o = g.options.find((x) => x.pressed === 'true'); return o ? (o.label === homeLabel ? 'UK and Ireland' : o.label) : ''; }).join(' · ');
const dr = this.state.drawer;
v.drawerInline = dr === 'inline';
v.drawerPinned = dr === 'pinned';
v.inlineExpanded = dr === 'inline' ? 'true' : 'false';
v.pinnedExpanded = dr === 'pinned' ? 'true' : 'false';
v.inlineLabel = dr === 'inline' ? 'Done' : 'Change options';
v.pinnedLabel = dr === 'pinned' ? 'Done' : 'Change options';
v.toggleInline = () => this.setState({ drawer: dr === 'inline' ? false : 'inline' });
v.togglePinned = () => this.setState({ drawer: dr === 'pinned' ? false : 'pinned' });
v.pinnedVisible = true;
v.checkPinned = (container) => {
const f = typeof document !== 'undefined' ? document.getElementById('facts') : null;
if (!f) return;
const top = container && container.getBoundingClientRect ? container.getBoundingClientRect().top : 0;
const show = f.getBoundingClientRect().bottom < top;
if (show !== !!this.state.pinned) this.setState({ pinned: show, drawer: !show && this.state.drawer === 'pinned' ? false : this.state.drawer });
};
v.onFrameScroll = (e) => v.checkPinned(e.currentTarget);
v.drawerCols = 'display: grid; grid-template-columns: repeat(' + v.groups.length + ', minmax(0, 1fr)); gap: 20px;';
v.filtered = false;
v.showAll = () => {};
v.contentTitle = 'Content that changes with these options';
v.contentIntro = '';
v.sections = secs.filter((x) => !x.hidden).map((x) => {
const just = !!last && x.rules.some((r) => r.label === last);
return {
name: x.name,
badge: just ? 'Just changed' : '',
badgeStyle: just ? badgeBase + ' background: #291647; color: #ffffff;' : 'display: none;',
boxStyle: boxBase + ' background: #ffffff; border: 2px solid ' + (just ? '#291647' : '#d9cbee') + ';',
rules: x.rules.map((r) => ({
label: r.label,
cases: r.cases.map((c) => {
const sel = c[0] === r.current;
return {
value: c[1],
effect: c[2],
selected: sel,
tag: c[3] === C ? C : '',
tagStyle: tagStyle(c[3]),
style: caseBase + (sel ? ' background: #ead8ff; border: 2px solid #291647; color: #291647;' : ' background: #ffffff; border: 2px solid #e6e0ee; color: #4a3a63;'),
dot: 'display: inline-block; flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; ' + (sel ? 'border: 5px solid #291647; background: #ffffff;' : 'border: 2px solid #8a7aa3; background: #ffffff;')
};
})
}))
};
});
v.level = lvl;
v.pickLevel = (e) => this.setState({ level: e.target.value, last: null, drawer: false, pinned: false });
return v;
}
}

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = new Component({});
let handlers = [];
const on = (fn) => { handlers.push(fn); return handlers.length - 1; };
function render() {
  handlers = [];
  const v = app.renderVals();
  const focusId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  const groups = v.groups.map((g, gi) => `
    <fieldset>
      <legend style="display: flex; align-items: center; gap: 10px">${esc(g.label)}<span style="${esc(g.tagStyle)}">${esc(g.tag)}</span></legend>
      <div class="choices">${g.options.map((o, oi) => `<button type="button" data-key="g${gi}o${oi}" data-h="${on(o.pick)}" aria-pressed="${o.pressed}" style="${esc(o.style)}"><span aria-hidden="true" style="${esc(o.dot)}"></span><span style="display: flex; flex-direction: column; gap: 2px">${esc(o.label)}<span style="font-size: 13px; font-weight: 500; color: inherit">${esc(o.sub)}</span></span></button>`).join('')}</div>
      ${g.hasNote ? `<p class="note">${esc(g.note)}</p>` : ''}
    </fieldset>`).join('');
  const facts = v.facts.map((f) => `<div><dt>${esc(f.label)}</dt><dd style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px">${esc(f.value)}<span style="${esc(f.tagStyle)}">${esc(f.tag)}</span></dd></div>`).join('');
  const sections = v.sections.map((s) => `
    <div style="${esc(s.boxStyle)}">
      <div class="sec-head"><h3>${esc(s.name)}</h3><span style="${esc(s.badgeStyle)}">${esc(s.badge)}</span></div>
      ${s.rules.map((r) => `<div class="rule"><p>${esc(r.label)}</p><div class="cases">${r.cases.map((c) => `<div style="${esc(c.style)}"><span style="display: flex; align-items: center; gap: 10px; font-weight: 600"><span aria-hidden="true" style="${esc(c.dot)}"></span>${esc(c.value)}</span><span style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap"><span>${esc(c.effect)}</span><span style="display: flex; gap: 6px"><span style="${esc(c.tagStyle)}">${esc(c.tag)}</span></span></span></div>`).join('')}</div></div>`).join('')}
    </div>`).join('');
  const vp = document.getElementById('vp');
  const scroll = vp ? vp.scrollTop : 0;
  document.getElementById('app').innerHTML = `
    <div class="proto-controls">
      <div class="level">
      <label for="study-level">Study level</label>
      <select id="study-level" data-key="level">
        ${[['ug', 'Undergraduate'], ['pgt', 'Postgraduate taught'], ['pgr', 'Research degree'], ['app', 'Degree apprenticeship'], ['short', 'Short course']].map(([k, l]) => `<option value="${k}"${k === v.level ? ' selected' : ''}>${l}</option>`).join('')}
      </select>
      <span>Example course: ${esc(v.example)}</span>
    </div>
    <div class="url"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#291647" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>winchester.ac.uk<strong>${esc(v.path)}</strong></span></div>
    </div>
    <div class="viewport" id="vp" aria-label="Course page prototype, 1280 by 832"><div class="wrap" aria-live="polite">
    <div style="display: flex; flex-direction: column; gap: 10px"><p class="eyebrow">${esc(v.award)}</p><h1>${esc(v.title)}</h1></div>
    <section class="facts-panel" id="facts" aria-labelledby="ov-h"><h2 id="ov-h">What you need to know</h2><dl>${facts}</dl>
      <div class="ctas"><a class="cta cta-primary" href="#">${esc(v.cta)} <span aria-hidden="true">→</span></a>${v.hasCta2 ? `<a class="cta cta-secondary" href="#">${esc(v.cta2)}</a>` : ''}</div>
      <p class="note">${esc(v.ctaNote)}</p></section>
    <section class="content" aria-labelledby="pc-h"><h2 id="pc-h">${esc(v.contentTitle)}</h2>${sections}</section>
    <p class="foot">Prototype for discussion. Course details were taken from winchester.ac.uk on 17 November 2026.</p>
    </div>
    ${v.pinnedVisible ? `<div class="pinbar">
      ${v.drawerPinned ? `<div id="pinned-drawer" class="pinbar-drawer"><div class="drawer-grid" style="${esc(v.drawerCols)}">${groups}</div>${v.hasFixed ? `<p class="note">${esc(v.fixed)}</p>` : ''}</div>` : ''}
      <div class="pinbar-row">
        <div class="pinbar-summary"><span>Your options</span> <strong>${esc(v.summary)}</strong></div>
        <button type="button" class="optbar-toggle" data-key="drawer-pinned" data-h="${on(v.togglePinned)}" aria-expanded="${v.pinnedExpanded}" aria-controls="pinned-drawer">${esc(v.pinnedLabel)}</button>
        <a class="cta cta-primary" href="#">${esc(v.cta)} <span aria-hidden="true">→</span></a>
      </div>
    </div>` : ''}
    </div>`;
  const vp2 = document.getElementById('vp'); if (vp2) { vp2.scrollTop = scroll; vp2.addEventListener('scroll', () => checkPinned()); }
  lastV = v;
  if (focusId) { const el = document.querySelector(`[data-key="${focusId}"]`); if (el) el.focus(); }
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-h]'); if (b) handlers[+b.dataset.h](); });
document.addEventListener('change', (e) => { if (e.target.id === 'study-level') app.renderVals().pickLevel({ target: { value: e.target.value } }); });
let lastV = null;
function checkPinned() { const vp = document.getElementById('vp'); if (!vp || !lastV) return; const framed = getComputedStyle(vp).overflowY === 'auto'; lastV.checkPinned(framed ? vp : null); }
window.addEventListener('scroll', () => checkPinned());
render();
</script>
</body>
</html>
