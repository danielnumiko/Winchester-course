<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BA (Hons) Accounting and Finance course page</title>
<meta name="description" content="Course page design prototype for the University of Winchester, using BA (Hons) Accounting and Finance as the example.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Playfair+Display:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#291647}a:hover{color:#8f48d5}

.sec{scroll-margin-top:96px}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 60px;align-items:start}
.hero-scroll{padding-bottom:40px}
.hero-media{position:sticky;top:20px;align-self:start;height:min(792px, 960px)}
@container page (max-width:899px){
.hero-row{grid-template-columns:1fr}
.hero-media{position:relative;top:0;order:-1;height:420px !important}
.cta-media{min-height:360px !important;order:-1}
.acc-row{grid-template-columns:1fr !important}
.two-col{grid-template-columns:1fr !important}
.cols-3,.cols-4,.cols-6{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.cta-motif{opacity:.35}
.nav-links{display:none !important}
.h1{font-size:52px !important}
.h2{font-size:46px !important}
.h2.h2-content{font-size:39px !important}
.jump-strip::-webkit-scrollbar{display:none}
.ev-row{grid-template-columns:1fr !important;padding:24px !important}
.person-card{grid-template-columns:120px minmax(0,1fr) !important}
.du-grid{grid-template-columns:1fr 1fr !important}
}
@container page (max-width:560px){
.cols-2,.cols-3,.cols-4,.cols-6{grid-template-columns:1fr !important}
.pad{padding-left:16px !important;padding-right:16px !important}
.mod-row{flex-wrap:wrap}
}

.teaser{transition:background-color .25s ease}
.teaser:hover,.teaser:focus-visible{background-color:#c68efd !important;border-color:#c68efd !important}
.t-img{position:relative;display:block;transform-origin:50% 50%;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.teaser:hover .t-img,.teaser:focus-visible .t-img{transform:scale(.94)}
.t-arrow{position:absolute;right:20px;bottom:20px;width:60px;height:60px;border-radius:5px;background:#c68efd;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(12px) scale(.9);transition:opacity .3s ease,transform .45s cubic-bezier(.22,1,.36,1);pointer-events:none;z-index:2}
.teaser:hover .t-arrow,.teaser:focus-visible .t-arrow{opacity:1;transform:none}
.t-clip{position:relative;width:14px;height:14px;overflow:hidden;display:block}
.t-clip svg{position:absolute;left:0;top:0;display:block;transition:transform .45s cubic-bezier(.65,0,.35,1) .15s}
.t-clip .a2{transform:translateX(-100%)}
.teaser:hover .t-clip .a1,.teaser:focus-visible .t-clip .a1{transform:translateX(100%)}
.teaser:hover .t-clip .a2,.teaser:focus-visible .t-clip .a2{transform:translateX(0)}
@media (prefers-reduced-motion: reduce){.teaser,.t-img,.t-arrow,.t-clip svg{transition:none !important}.teaser:hover .t-img{transform:none}}

.info-acc summary::-webkit-details-marker{display:none}
.info-acc .acc-chev{flex:none;transition:transform .2s ease}
.info-acc[open] .acc-chev{transform:rotate(180deg)}
</style>

<style>
html,body{height:100%}
body{background:#e4dcee;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{width:1280px;height:832px;flex:none;overflow-y:auto;overflow-x:hidden;background:#ffffff;container:page/inline-size;scroll-behavior:smooth;border-radius:8px;box-shadow:0 12px 40px rgba(41,22,71,.25);transform-origin:center center}
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="app"><noscript><p style="padding:40px;font-family:sans-serif">This prototype needs JavaScript to run.</p></noscript></div></div></div>
<template id="tpl">
<div style="font-family: Figtree, sans-serif; color: #291647; background: #ffffff; min-width: 0">
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><defs><clipPath id="cta-wave" clipPathUnits="objectBoundingBox"><path d="M0,0 L0.84,0 C0.9,0.14 0.96,0.28 1,0.4 L1,0.86 C0.72,0.84 0.42,0.87 0.2,1 L0,1 C0.07,0.72 0.07,0.28 0,0 Z"></path></clipPath><clipPath id="cta-wave-l" clipPathUnits="objectBoundingBox"><path d="M1,0 L0.16,0 C0.1,0.14 0.04,0.28 0,0.4 L0,0.86 C0.28,0.84 0.58,0.87 0.8,1 L1,1 C0.93,0.72 0.93,0.28 1,0 Z"></path></clipPath></defs></svg>

<!-- HERO -->
<header class="hero pad" style="background: #c68efd; padding: 20px 40px 40px; border-bottom: 1px solid #b57bef">
  <nav aria-label="Main" style="max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 10px 10px 10px 16px; background: #291647; border-radius: 5px; min-height: 80px; box-sizing: border-box">
    <a href="#" aria-label="University of Winchester home" style="display: flex; align-items: center"><img src="images/logo.svg" alt="University of Winchester" style="height: 40px; width: auto; display: block"></a>
    <div class="nav-links" style="display: flex; gap: 20px; font-size: 16px; font-weight: 500">
      <a href="#" style="color: #ffffff; text-decoration: none">Study</a>
      <a href="#" style="color: #ffffff; text-decoration: none">Life at Winchester</a>
      <a href="#" style="color: #ffffff; text-decoration: none">Open days</a>
      <a href="#" style="color: #ffffff; text-decoration: none">Clearing</a>
    </div>
    <div style="display: flex; gap: 10px">
      <button type="button" style="min-height: 60px; padding: 0 18px; border: 0; border-radius: 5px; background: #c68efd; color: #291647; font: 500 16px Figtree, sans-serif; display: flex; align-items: center; gap: 10px; cursor: pointer">Menu <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#291647" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
      <button type="button" style="min-height: 60px; padding: 0 18px; border: 0; border-radius: 5px; background: #c68efd; color: #291647; font: 500 16px Figtree, sans-serif; display: flex; align-items: center; gap: 10px; cursor: pointer">Ask us anything <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#291647" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg></button>
    </div>
  </nav>


  <div class="hero-row" style="max-width: 1200px; margin: 20px auto 0">
    <div class="hero-scroll" style="display: flex; flex-direction: column; gap: 0; min-width: 0">
      <nav aria-label="Breadcrumb" style="margin: 56px 0 0">
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 16px; font-weight: 500">
          <li style="display: flex; align-items: center; gap: 10px"><a href="#" style="color: #291647; text-decoration: none">Study</a><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6d33b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></li>
          <li style="display: flex; align-items: center; gap: 10px"><a href="#" style="color: #291647; text-decoration: none">Undergraduate</a><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6d33b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></li>
        </ol>
      </nav>
      <h1 class="h1" style="margin: 14px 0 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 78px; line-height: 1.05; letter-spacing: -0.01em">Accounting and Finance</h1>
      <p style="margin: 40px 0 0; font-size: 35px; font-weight: 500; line-height: 1.2">BA (Hons)</p>
      <p style="margin: 48px 0 0; font-size: 20px; font-weight: 500; line-height: 1.6">From balance sheets to bold solutions.</p>
      <p style="margin: 12px 0 0; font-size: 18px; font-weight: 500; line-height: 1.6">Launch your finance career with a degree that looks beyond the spreadsheets. We'll equip you with professional qualifications while developing the human skills that employers truly value. Our award-nominated programme balances technical expertise with real-world application.</p>
      <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 48px">
        <a href="#apply" style="min-height: 60px; padding: 0 22px; border-radius: 5px; background: #291647; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; gap: 10px">{{ applyLabel }} <span aria-hidden="true">→</span></a>
        <a href="#open-days" style="min-height: 60px; padding: 0 22px; border-radius: 5px; border: 2px solid #291647; color: #291647; text-decoration: none; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; gap: 10px; box-sizing: border-box">Book an open day <span aria-hidden="true">→</span></a>
      </div>


      <dl style="margin: 56px 0 0; padding-top: 32px; border-top: 1px solid #8f48d5; display: flex; flex-direction: column; gap: 30px">
        <sc-for list="{{ facts }}" as="f" hint-placeholder-count="6">
          <div>
            <dt style="font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase">{{ f.label }}</dt>
            <dd style="margin: 8px 0 0; font-size: 24px; font-weight: 500; line-height: 1.4; display: flex; align-items: center; gap: 12px; flex-wrap: wrap"><span style="white-space: pre-line">{{ f.value }}</span><sc-if value="{{ f.hasTag }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 12px; background: #d4ef70; color: #291647; font-size: 12px; font-weight: 600">To confirm</span></sc-if></dd>
          </div>
        </sc-for>
      </dl>

      <a href="#open-days" aria-labelledby="hero-od-h" style="margin-top: 48px; padding: 16px 24px 16px 16px; background: #ffffff; border-radius: 15px; display: flex; align-items: center; gap: 20px; color: #291647; text-decoration: none">
        <img src="images/facilities.jpg" alt="" style="flex: none; width: 96px; height: 72px; border-radius: 10px; object-fit: cover; display: block">
        <div style="min-width: 0">
          <h2 id="hero-od-h" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase">Next open day</h2>
          <span style="display: block; margin: 8px 0 0; font-size: 24px; font-weight: 500; line-height: 1.4">Saturday 28 November 2026</span>
        </div>
      </a>
    </div>

    <div class="hero-media" style="border-radius: 15px; overflow: hidden; background: #8f48d5">
      <img src="images/hero.jpg" alt="Two students walking past a stone wall on campus" style="width: 100%; height: 100%; object-fit: cover; object-position: 40% 50%; display: block">
      <button type="button" aria-label="Play video" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border: 0; border-radius: 5px; background: #291647; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="#ffffff"></path></svg></button>
    </div>
  </div>
</header>

<!-- JUMP LINKS -->
<nav aria-label="On this page" style="position: sticky; top: 0; z-index: 20; background: #291647; color: #ffffff">
  <div class="pad" style="max-width: 1200px; margin: 0 auto; padding: 0 40px; min-height: 88px; display: flex; align-items: center; justify-content: center; gap: 24px">
    <ul class="jump-strip" style="list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 32px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; min-width: 0">
      <sc-for list="{{ jumpLinks }}" as="j" hint-placeholder-count="6">
        <li><a href="{{ j.href }}" aria-current="{{ j.current }}" style="{{ j.style }}">{{ j.label }}</a></li>
      </sc-for>
    </ul>
  </div>
  <div aria-hidden="true" style="height: 5px; background: #8f48d5"><div style="{{ progressStyle }}"></div></div>
</nav>

<main>

<!-- COURSE OVERVIEW -->
<section id="overview" class="sec pad" aria-labelledby="overview-h" style="padding: 80px 40px; border-bottom: 1px solid #ead8ff">
  <div class="two-col" style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 387px minmax(0, 1fr); gap: 20px 60px">
    <h2 id="overview-h" class="h2 h2-content" style="margin: 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 52px; line-height: 1.1">Course overview</h2>
    <div>
      <div id="rm-overview" style="{{ rm.overview.box }}">
      <div style="display: flex; flex-direction: column; gap: 18px; font-size: 18px; font-weight: 500; line-height: 1.6; color: #5c358e">
      <p style="margin: 0">Financial careers are evolving fast. While AI can handle the routine tasks, today's finance professionals need to be communicators, problem solvers, strategic advisors, and ethical decision-makers. Our programme prepares you for this reality.</p>
      <p style="margin: 0">From day one, you'll apply accounting principles to real scenarios from actual companies. This hands-on approach means you'll graduate ready to hit the ground running, not just with theoretical knowledge but practical experience that employers seek.</p>
      <p style="margin: 0">You'll benefit from our close-knit learning environment where lecturers know you by name and provide tailored guidance on your journey toward professional status. Many of our academics are qualified Chartered Accountants who bring current industry practices directly into the classroom.</p>
      <p style="margin: 0">Our degree offers exemptions from four professional accounting bodies, including the maximum exemption from up to nine papers from the Association of Chartered Certified Accountants (ACCA).</p>
    </div>
      <sc-if value="{{ rm.overview.fade }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: linear-gradient(rgba(255,255,255,0), #ffffff); pointer-events: none"></span></sc-if>
      </div>
      <button type="button" aria-expanded="{{ rm.overview.expanded }}" aria-controls="rm-overview" onClick="{{ rm.overview.toggle }}" style="width: 100%; margin-top: 4px; display: flex; align-items: center; gap: 14px; padding: 16px 0 0; border: 0; border-top: 1px solid #d9cbee; background: transparent; color: #291647; font: 500 18px Figtree, sans-serif; text-align: left; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#291647" stroke-width="1.8" aria-hidden="true" style="{{ rm.overview.chev }}"><circle cx="12" cy="12" r="10"></circle><path d="M8 10.5l4 4 4-4"></path></svg><span>{{ rm.overview.label }}</span></button>
    </div>
  </div>
</section>

<!-- WHY CHOOSE WINCHESTER -->
<section id="why" class="sec pad" aria-labelledby="why-h" style="padding: 80px 40px; border-bottom: 1px solid #ead8ff">
  <div style="max-width: 1200px; margin: 0 auto">
    <h2 id="why-h" class="h2 h2-content" style="margin: 0 0 48px; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 52px; line-height: 1.1">Why choose Winchester</h2>
    <div class="cols-6" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 32px 20px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <svg width="80" height="80" viewBox="0 0 96 96" fill="none" aria-hidden="true" style="display: block"><path fill="#8f48d5" d="M16 80 V60 H36 V40 H56 V80 Z"/><rect fill="#632da8" x="56" y="20" width="24" height="60"/></svg>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">Fast-track to qualification</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5c358e; font-weight: 500">Get a head start on your professional journey with our maximum 9 ACCA exemptions.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <svg width="80" height="80" viewBox="0 0 96 96" fill="none" aria-hidden="true" style="display: block"><path fill="#8f48d5" fill-rule="evenodd" d="M18 80 a30 30 0 0 1 60 0 Z M31 80 a17 17 0 0 1 34 0 Z"/><path fill="#632da8" d="M37 80 a11 11 0 0 1 22 0 Z"/><circle fill="#632da8" cx="48" cy="28" r="13"/></svg>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">Learn from industry experts</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5c358e; font-weight: 500">Practising Chartered Accountants who know what employers want.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <svg width="80" height="80" viewBox="0 0 96 96" fill="none" aria-hidden="true" style="display: block"><path fill="#8f48d5" d="M18 18 H48 A30 30 0 0 1 18 48 Z"/><path fill="#632da8" d="M78 18 V48 A30 30 0 0 1 48 18 Z"/><path fill="#8f48d5" d="M78 78 H48 A30 30 0 0 1 78 48 Z"/><path fill="#632da8" d="M18 78 V48 A30 30 0 0 1 48 78 Z"/></svg>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">Apply your knowledge</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5c358e; font-weight: 500">To real financial challenges through case studies and industry simulations.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <svg width="80" height="80" viewBox="0 0 96 96" fill="none" aria-hidden="true" style="display: block"><g fill="#8f48d5"><circle cx="79.0" cy="48.0" r="6"/><circle cx="69.9" cy="69.9" r="6"/><circle cx="48.0" cy="79.0" r="6"/><circle cx="26.1" cy="69.9" r="6"/><circle cx="17.0" cy="48.0" r="6"/><circle cx="26.1" cy="26.1" r="6"/><circle cx="48.0" cy="17.0" r="6"/><circle cx="69.9" cy="26.1" r="6"/></g><circle fill="#632da8" cx="48" cy="48" r="15"/></svg>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">97% student satisfaction</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5c358e; font-weight: 500">With the teaching and learning resources on this course.</p>
        <p style="margin: 0; font-size: 13px; color: #5c358e; font-weight: 500">National Student Survey 2026</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <svg width="80" height="80" viewBox="0 0 96 96" fill="none" aria-hidden="true" style="display: block"><g fill="#8f48d5"><circle cx="65" cy="31" r="14"/><circle cx="31" cy="65" r="14"/></g><g fill="#632da8"><circle cx="31" cy="31" r="14"/><circle cx="65" cy="65" r="14"/></g></svg>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">Network with employers</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5c358e; font-weight: 500">Opportunities to connect at our finance-focused careers events.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <svg width="80" height="80" viewBox="0 0 96 96" fill="none" aria-hidden="true" style="display: block"><path fill="#632da8" d="M88 70 A16 16 0 1 0 72 86 H88 Z"/><path fill="#8f48d5" fill-rule="evenodd" d="M12 46 A30 30 0 1 1 42 76 H12 Z M31 46 a3.5 3.5 0 1 0 0.01 0 Z M42 46 a3.5 3.5 0 1 0 0.01 0 Z M53 46 a3.5 3.5 0 1 0 0.01 0 Z"/></svg>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">Skills beyond the numbers</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5c358e; font-weight: 500">Develop the human side of accounting with communication, creativity and critical thinking.</p>
      </div>
    </div>
  </div>
</section>

<!-- APPLICATION ROUTE -->
<section id="apply" class="sec pad" aria-labelledby="apply-h" style="padding: 80px 40px; background: #ffffff; border-bottom: 1px solid #ead8ff">
  <div class="two-col" style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 387px minmax(0, 1fr); gap: 20px 60px">
    <div>
      <h2 id="apply-h" class="h2 h2-content" style="margin: 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 52px; line-height: 1.1">How to apply</h2>
      <p style="margin: 20px 0 0; font-size: 18px; line-height: 1.6; color: #5c358e; font-weight: 500">How you apply depends on your fee status.</p>
      <p style="margin: 16px 0 0; font-size: 18px"><a href="#" style="color: #291647; font-weight: 600">How to apply for this course</a></p>
    </div>
    <div class="cols-2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
      <div style="{{ ukCardStyle }}">
        <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase">{{ ukCardTag }}</p>
        <h3 style="margin: 0; font-size: 26px; font-weight: 500">UK students</h3>
        <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #5c358e; font-weight: 500">Apply through UCAS using the course code NN34.</p>
        <a href="#" style="margin-top: auto; min-height: 56px; padding: 0 20px; border-radius: 5px; background: #291647; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; justify-content: space-between; gap: 10px">Apply now (for UK students) <span aria-hidden="true">→</span></a>
      </div>
      <div style="{{ intlCardStyle }}">
        <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase">{{ intlCardTag }}</p>
        <h3 style="margin: 0; font-size: 26px; font-weight: 500">International students</h3>
        <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #5c358e; font-weight: 500">Apply through our partner, Oxford International.</p>
        <a href="#" style="margin-top: auto; min-height: 56px; padding: 0 20px; border-radius: 5px; background: #291647; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; justify-content: space-between; gap: 10px">Apply now (for International students) <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </div>
</section>

<!-- COURSE STRUCTURE -->
<section id="modules" class="sec pad" aria-labelledby="modules-h" style="padding: 80px 40px; border-bottom: 1px solid #ead8ff">
  <div style="max-width: 1200px; margin: 0 auto">
    <div class="two-col" style="display: grid; grid-template-columns: 387px minmax(0, 1fr); gap: 20px 60px">
    <h2 id="modules-h" class="h2 h2-content" style="margin: 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 52px; line-height: 1.1">Course details</h2>
    <div style="display: flex; flex-direction: column; gap: 18px; font-size: 18px; font-weight: 500; line-height: 1.6; color: #5c358e"><p style="margin: 0">At Winchester, we transform you into finance professionals who are ready for the modern workplace. Our approach balances academic rigour with practical skills in a supportive environment where your growth matters.</p><p style="margin: 0">While traditional accounting programmes rely heavily on exams and theory, we embed real-world application throughout your learning. You’ll master the technical requirements needed for professional exemptions (with most accredited modules requiring 70% exam assessment), but we also offer project-based alternatives like Digital Finance, Data Analysis, and Financial Modelling for students who thrive on practical projects.</p><p style="margin: 0">You are taught primarily through a combination of lectures, seminars, and workshops, allowing opportunities to discuss and develop your understanding of topics in smaller groups to become a confident learner.</p></div>
    </div>
    <div class="two-col" style="background: #f3e9ff; border-radius: 15px; padding: 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; align-items: start; box-sizing: border-box; margin-top: 32px">
      <div role="tablist" aria-label="Year of study" style="display: flex; gap: 10px; overflow-x: auto; padding: 2px">
      <sc-for list="{{ yearTabs }}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" id="{{ t.id }}" aria-selected="{{ t.pressed }}" aria-controls="year-panel" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>
      <div id="year-panel" role="tabpanel" aria-labelledby="{{ yearTabId }}" style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; min-width: 0">
      <div>
        <h3 style="margin: 0; font-size: 30px; font-weight: 500; line-height: 1.25">{{ year.heading }}</h3>
        <p style="margin: 16px 0 0; max-width: 820px; font-size: 17px; line-height: 1.6; color: #5c358e; font-weight: 500">{{ year.intro }}</p>
        <sc-if value="{{ yh.has }}" hint-placeholder-val="{{ true }}">
          <p style="margin: 20px 0 0; max-width: 820px; font-size: 17px; line-height: 1.6; color: #5c358e; font-weight: 500">Your study time this year:</p>
          <ul style="margin: 8px 0 0; padding-left: 22px; max-width: 820px; display: flex; flex-direction: column; gap: 4px; font-size: 17px; line-height: 1.6; color: #5c358e; font-weight: 500">
            <li>{{ yh.total }} hours in total</li>
            <li>{{ yh.teaching }} hours of teaching, learning and assessment</li>
            <li>{{ yh.independent }} hours of independent learning</li>
          </ul>

          <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 8px">
            <details class="info-acc" style="background: #ffffff; border-radius: 5px">
              <summary style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; min-height: 64px; box-sizing: border-box; cursor: pointer; list-style: none; font: 500 18px Figtree, sans-serif; color: #291647"><svg class="acc-chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#291647" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 10.5l4 4 4-4"></path></svg><span>Teaching hours</span></summary>
              <div style="padding: 4px 18px 22px 56px; display: flex; flex-direction: column; gap: 12px; max-width: 860px; font-size: 16px; line-height: 1.6; color: #5c358e; font-weight: 500"><p style="margin: 0">All class based teaching takes places between 9am – 6pm, Monday to Friday during term time. Wednesday afternoons are kept free from timetabled teaching for personal study time and for sports clubs and societies to train, meet and play matches. There may be some occasional learning opportunities (for example, an evening guest lecturer or performance) that take places outside of these hours for which you will be given forewarning.</p></div>
            </details>
            <details class="info-acc" style="background: #ffffff; border-radius: 5px">
              <summary style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; min-height: 64px; box-sizing: border-box; cursor: pointer; list-style: none; font: 500 18px Figtree, sans-serif; color: #291647"><svg class="acc-chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#291647" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 10.5l4 4 4-4"></path></svg><span>Assessment</span></summary>
              <div style="padding: 4px 18px 22px 56px; display: flex; flex-direction: column; gap: 12px; max-width: 860px; font-size: 16px; line-height: 1.6; color: #5c358e; font-weight: 500"><p style="margin: 0">Our validated courses may adopt a range of means of assessing your learning. An indicative, and not necessarily comprehensive, list of assessment types you might encounter includes essays, portfolios, supervised independent work, presentations, written exams, or practical performances.</p><p style="margin: 0">We ensure all students have an equal opportunity to achieve module learning outcomes. As such, where appropriate and necessary, students with recognised disabilities may have alternative assignments set that continue to test how successfully they have met the module’s learning outcomes. Further details on assessment types used on the course you are interested in can be found on the course page, by attending an Open Day or Open Evening, or contacting our teaching staff.</p><p style="margin: 0">The assessment balance between examination and coursework depends to some extent on the optional modules you choose. The approximate percentage of this year assessed by different assessment modes is:</p><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px"><li>Coursework: {{ yh.cw }}</li><li>Written exams: {{ yh.ex }}</li><li>Practical: {{ yh.pr }}</li></ul></div>
            </details>
          </div>
        </sc-if>
        <sc-if value="{{ yh.none }}" hint-placeholder-val="{{ false }}">
          <p style="margin: 28px 0 0; padding-top: 24px; border-top: 1px solid #c68efd; font-size: 16px; line-height: 1.6">You won't have timetabled teaching during your placement year, as you'll be working with your employer.</p>
        </sc-if>
      </div>
      <div>
        <h4 style="margin: 0; font-size: 30px; font-weight: 500; line-height: 1.25; color: #291647">Modules</h4>
        <ul style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{ year.modules }}" as="m" hint-placeholder-count="4">

              <h4 style="margin: 0; font-weight: 500">
                <button type="button" class="mod-row" aria-expanded="{{ m.expanded }}" onClick="{{ m.toggle }}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; min-height: 64px; border: 0; background: transparent; color: #291647; text-align: left; cursor: pointer; font: 500 18px Figtree, sans-serif; box-sizing: border-box">
                  <span style="display: flex; align-items: center; gap: 14px; min-width: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#291647" stroke-width="1.8" aria-hidden="true" style="{{ m.chevron }}"><circle cx="12" cy="12" r="10"></circle><path d="M8 10.5l4 4 4-4"></path></svg><span>{{ m.name }}</span></span>
                  <span style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
                    <span style="{{ m.typeStyle }}">{{ m.type }}</span>
                    <span style="display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; border-radius: 3px; background: #d4ef70; font-size: 14px; font-weight: 500">{{ m.credits }}</span>
                  </span>
                </button>
              </h4>
              <sc-if value="{{ m.open }}" hint-placeholder-val="{{ false }}">
                <div style="padding: 4px 18px 22px; border-top: 1px solid #f3e9ff; max-width: 860px">
                  <sc-for list="{{ m.parts }}" as="pt" hint-placeholder-count="2">
                    <div style="margin-top: 14px">
                      <sc-if value="{{ pt.hasTitle }}" hint-placeholder-val="{{ false }}"><h5 style="margin: 0 0 6px; font-size: 16px; font-weight: 600">{{ pt.title }}</h5></sc-if>
                      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #5c358e; font-weight: 500">{{ pt.text }}</p>
                    </div>
                  </sc-for>
                </div>
              </sc-if>
            </li>
          </sc-for>
        </ul>
        <p style="margin: 16px 0 0; font-size: 15px; color: #5c358e; font-weight: 500">{{ year.note }}</p>
      </div>
      <p style="margin: 0; padding-top: 20px; border-top: 1px solid #c68efd; font-size: 13px; color: #5c358e; font-weight: 500">Hours are indicative. Modules are correct at the time of publishing and may change.</p>
    </div>
    </div>
  </div>
</section>

<section id="accreditations" class="sec pad" aria-labelledby="acc-h" style="padding: 80px 40px; border-bottom: 1px solid #ead8ff">

    <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #5c358e; font-weight: 500">Our BA (Hons) Accounting and Finance programme is accredited by prestigious professional bodies known for their commitment to excellence and maintaining the highest standards. This ensures that your experience at the University of Winchester is of the highest quality, aligned with industry best practices. It also helps to boost your employability and can give you exemptions from some professional exams as follows:</p>
    </div>
    <ol style="list-style: none; margin: 52px 0 0; padding: 0">
      <li class="acc-row" style="display: grid; grid-template-columns: 387px minmax(0, 1fr); gap: 20px 60px; align-items: start; padding: 28px 0; border-top: 1px solid #ead8ff">
        <div style="aspect-ratio: 16 / 9; background: #ffffff; border: 1px solid #ead8ff; border-radius: 10px; display: flex; align-items: center; justify-content: center; width: 100%">
          <img src="images/icaew.png" alt="ICAEW Partner in Learning logo" style="max-width: 62%; max-height: 62%; object-fit: contain; display: block">
        </div>
        <div>
          <h3 style="margin: 0; font-size: 30px; font-weight: 500; line-height: 1.25">ICAEW Partner in Learning</h3>
          <p style="margin: 20px 0 0; font-size: 16px; line-height: 1.6; color: #5c358e; font-weight: 500">The University of Winchester is recognised as an Institute of Chartered Accountants in England and Wales (ICAEW) Partner in Learning, working with ICAEW in the professional development of students. This allows you to apply for exemption from some modules when studying for the professional chartered accountant (ACA) qualification after graduating.</p>
        </div>
      </li>
      <li class="acc-row" style="display: grid; grid-template-columns: 387px minmax(0, 1fr); gap: 20px 60px; align-items: start; padding: 28px 0; border-top: 1px solid #ead8ff">
        <div style="aspect-ratio: 16 / 9; background: #ffffff; border: 1px solid #ead8ff; border-radius: 10px; display: flex; align-items: center; justify-content: center; width: 100%">
          <img src="images/acca.png" alt="ACCA Accredited Programme logo" style="max-width: 62%; max-height: 62%; object-fit: contain; display: block">
        </div>
        <div>
          <h3 style="margin: 0; font-size: 30px; font-weight: 500; line-height: 1.25">ACCA accredited</h3>
          <p style="margin: 20px 0 0; font-size: 16px; line-height: 1.6; color: #5c358e; font-weight: 500">This degree is accredited by the Association of Chartered Certified Accountants and you can apply for up to the maximum exemption from 9 modules when studying for the professional qualification after graduating.</p>
        </div>
      </li>
      <li class="acc-row" style="display: grid; grid-template-columns: 387px minmax(0, 1fr); gap: 20px 60px; align-items: start; padding: 28px 0; border-top: 1px solid #ead8ff">
        <div style="aspect-ratio: 16 / 9; background: #ffffff; border: 1px solid #ead8ff; border-radius: 10px; display: flex; align-items: center; justify-content: center; width: 100%">
          <img src="images/cima.png" alt="AICPA and CIMA logo" style="max-width: 62%; max-height: 62%; object-fit: contain; display: block">
        </div>
        <div>
          <h3 style="margin: 0; font-size: 30px; font-weight: 500; line-height: 1.25">CIMA</h3>
          <p style="margin: 20px 0 0; font-size: 16px; line-height: 1.6; color: #5c358e; font-weight: 500">Chartered Institute of Management Accountants (CIMA) accreditation will exempt you from the certificate and operational level modules of its professional syllabus.</p>

<!-- CAREERS (same component as course overview) -->
<section id="careers" class="sec pad" aria-labelledby="car-h" style="padding: 80px 40px; border-bottom: 1px solid #ead8ff">
  <div class="two-col" style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 387px minmax(0, 1fr); gap: 20px 60px">
    <h2 id="car-h" class="h2 h2-content" style="margin: 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 52px; line-height: 1.1">Career prospects</h2>
    <div>
      <div id="rm-careers" style="{{ rm.careers.box }}">
      <div style="display: flex; flex-direction: column; gap: 18px; font-size: 18px; font-weight: 500; line-height: 1.6; color: #5c358e">
      <p style="margin: 0">A degree in Accounting and Finance from Winchester opens doors to diverse and rewarding career paths. Our graduates are sought after for their combination of technical expertise, professional exemptions, and well-developed interpersonal skills.</p>
      <p style="margin: 0">Many of our alumni have secured positions at prestigious organisations including the "Big Four" accounting firms, major corporations like Next and Tesco, and public sector bodies such as HMRC. The roles they take on are equally varied – from audit trainees and tax specialists to financial analysts, management accountants, and general business managers.</p>
      <p style="margin: 0">The flexibility of our degree prepares you for multiple career directions:</p>
      <ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px"><li><strong style="font-weight: 600; color: #291647">Professional practice</strong>: Fast-track your journey to becoming a chartered accountant with our extensive professional exemptions.</li><li><strong style="font-weight: 600; color: #291647">Corporate finance</strong>: Apply your skills in treasury, financial analysis, or management accounting roles across all business sectors</li><li><strong style="font-weight: 600; color: #291647">Public sector</strong>: Contribute to financial management in government departments, local authorities, or public services.</li><li><strong style="font-weight: 600; color: #291647">Financial services</strong>: Pursue opportunities in banking, insurance, or investment management.</li><li><strong style="font-weight: 600; color: #291647">Entrepreneurship</strong>: Develop the financial acumen to launch and manage your own business.</li></ul>
      <p style="margin: 0">From your first year, we focus on building your employability with targeted support, including regular workshops on professional applications and interview techniques, career guidance from academics with industry connections, opportunities to network with employers at our finance-focused careers events, personalised advice on navigating competitive graduate schemes and optional placement experiences that build your professional network.</p>
      <p style="margin: 0">The accounting profession is evolving rapidly with technological advancement, but this creates opportunities rather than threats for well-prepared graduates. Our programme's emphasis on developing both technical and human skills ensures you'll be positioned to add value in ways that technology cannot – through analysis, interpretation, ethical judgement, and strategic thinking.</p>
      <p style="margin: 0">Today's finance sector needs professionals who can adapt quickly, make sound judgements, and communicate complex information clearly to non-specialists. Our "Discovering Your Subject" module develops these crucial skills alongside your technical knowledge. You'll learn to see accounting as more than calculations – it's about telling the financial story of a business and helping shape its future.</p>
      <p style="margin: 0">This comprehensive approach produces graduates who aren't just exam-ready but workplace-ready. You'll emerge with the confidence to apply your knowledge flexibly, the ability to work with diverse teams, and the adaptability to thrive as the profession continues to evolve. That's the Winchester difference – an education that prepares you not just for your first job, but for a fulfilling career.</p>
      <h3 style="margin: 14px 0 0; font-size: 24px; font-weight: 500; line-height: 1.2; color: #291647">Pre-approved for a Masters</h3>
      <p style="margin: 0">If you study a Bachelor Honours Degree with us, you will be pre-approved to start a Masters degree at Winchester. To be eligible, you will need to apply by the end of March in the final year of your degree and meet the entry requirements of your chosen Masters degree.</p>
    </div>
      <sc-if value="{{ rm.careers.fade }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: linear-gradient(rgba(255,255,255,0), #ffffff); pointer-events: none"></span></sc-if>
      </div>
      <button type="button" aria-expanded="{{ rm.careers.expanded }}" aria-controls="rm-careers" onClick="{{ rm.careers.toggle }}" style="width: 100%; margin-top: 4px; display: flex; align-items: center; gap: 14px; padding: 16px 0 0; border: 0; border-top: 1px solid #d9cbee; background: transparent; color: #291647; font: 500 18px Figtree, sans-serif; text-align: left; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#291647" stroke-width="1.8" aria-hidden="true" style="{{ rm.careers.chev }}"><circle cx="12" cy="12" r="10"></circle><path d="M8 10.5l4 4 4-4"></path></svg><span>{{ rm.careers.label }}</span></button>

<!-- FEES (rich text slice, same component as course overview) -->
<section id="fees" class="sec pad" aria-labelledby="fees-h" style="padding: 80px 40px; border-bottom: 1px solid #ead8ff">
  <div class="two-col" style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 387px minmax(0, 1fr); gap: 20px 60px">
    <div>
      <h2 id="fees-h" class="h2 h2-content" style="margin: 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 52px; line-height: 1.1">How much will university cost me?</h2>

    </div>
    <div>

      <div style="display: flex; flex-direction: column; gap: 18px; font-size: 18px; font-weight: 500; line-height: 1.6; color: #5c358e">
      <div style="background: #f3e9ff; border-radius: 15px; padding: 28px 32px 12px">
      <h3 style="margin: 0; font-size: 24px; font-weight: 500; line-height: 1.2; color: #291647">2027/28 tuition fees</h3>
      <dl style="margin: 16px 0 0; display: flex; flex-direction: column">
        <sc-for list="{{ feeRows }}" as="r" hint-placeholder-count="3">
          <div class="cols-2" style="display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 6px 20px; padding: 16px 0; border-top: 1px solid #c68efd">
            <dt style="font-size: 17px; font-weight: 600">{{ r.k }}</dt>
            <dd style="margin: 0; font-size: 17px; line-height: 1.5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><span>{{ r.v }}</span><sc-if value="{{ r.hasTag }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 12px; background: #d4ef70; font-size: 12px; font-weight: 600">To confirm</span></sc-if></dd>
          </div>
        </sc-for>
      </dl>
      </div>
      <h3 style="margin: 22px 0 0; font-size: 24px; font-weight: 500; line-height: 1.2; color: #291647">Additional tuition fee information</h3>
      <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0">*(UK / Channel Islands / Isle of Man / Republic of Ireland) £10,050 for the 27/28 academic year. Fees for future academic years will be determined in line with our Terms and Conditions. The fee is currently subject to a governmental fee cap for each academic year. It is our policy to charge tuition fees at the level of the cap set by the Government. If the cap set by the Government changes, then we may increase our Fees in line with governmental policy.</p>
      <p style="margin: 0">Remember, you don’t have to pay any of this upfront if you are able to get a tuition fee loan from the UK Government to cover the full cost of your fees each year.</p>
      <p style="margin: 0">UK Part-Time fees are calculated on a pro rata basis of the full-time fee for a 120 credit course. The fee for a single credit is £83.75 and a 15 credit module is £1,256. Part-time students can take up to a maximum 90 credits per year, so the maximum fee in a given year will be the government permitted maximum fee of £7,530</p>
      </sc-if>
      <sc-if value="{{ isIntl }}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0">*(International) £16,700 for the 27/28 academic year. Fees for future academic years will be determined in line with our Terms and Conditions. We decide the annual level of increase of our Tuition Fees by taking into account a range of factors including the cost of delivering the course and change in governmental funding.</p>
      <p style="margin: 0">International part-time fees are calculated on a pro rata basis of the full-time fee for a 120 credit course. The fee for a single credit is £139.14 and a 15 credit module is £2,087.</p>
      </sc-if>
      <h3 style="margin: 22px 0 0; font-size: 24px; font-weight: 500; line-height: 1.2; color: #291647">Additional costs</h3>
      <p style="margin: 0">As one of our students all of your teaching and assessments are included in your tuition fees, including, lectures/guest lectures and tutorials, seminars, laboratory sessions and specialist teaching facilities. You will also have access to a wide range of student support and IT services.</p>
      <p style="margin: 0">There might be additional costs you may encounter whilst studying. The following highlights optional costs for this course:</p>
      <h4 style="margin: 6px 0 0; font-size: 20px; font-weight: 500; line-height: 1.2; color: #291647">Optional</h4>
      <p style="margin: 0"><strong style="font-weight: 600; color: #291647">Core Text</strong>: it is recommended that you purchase the latest editions of all of the core textbooks. Many of these texts relate to extensive online material for which you require an access code supplied with the textbook. It is possible for students to purchase second-hand copies where applicable. Indicative cost is £50-£200 per year.</p>
      <p style="margin: 0"><strong style="font-weight: 600; color: #291647">Volunteering and Placements</strong>: you may incur travel costs on optional volunteering placements in the third year of study. Indicative cost is £5-£30 per day.</p>
      <p style="margin: 0"><strong style="font-weight: 600; color: #291647">Smart Clothing</strong>: you may be expected to dress formally for oral assessments. Costs will vary depending on the students existing wardrobe. Indicative cost is £0-£50.</p>
      <p style="margin: 0"><strong style="font-weight: 600; color: #291647">Trips</strong>: you may be asked to contribute a small amount towards travel costs. Indicative cost is £10 per trip.</p>
      <h3 style="margin: 22px 0 0; font-size: 24px; font-weight: 500; line-height: 1.2; color: #291647">Scholarships, bursaries and awards</h3>
      <p style="margin: 0">We have a variety of scholarship and bursaries available to support you financially with the cost of your course. To see if you’re eligible, please see our <a href="#" style="color: #291647; font-weight: 600">Scholarships and Awards</a>.</p>
      <a href="#" style="align-self: flex-start; min-height: 60px; padding: 0 20px; border-radius: 5px; background: #291647; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; gap: 10px">Visit student finance <span aria-hidden="true">→</span></a>
    </div>

<script>var SCROLLER = document.getElementById('frame'), FRAME_SCALE = 1; function fitFrame() { FRAME_SCALE = Math.min(1, (innerWidth - 32) / 1280, (innerHeight - 32) / 832); SCROLLER.style.transform = FRAME_SCALE < 1 ? 'scale(' + FRAME_SCALE + ')' : ''; } fitFrame(); addEventListener('resize', fitFrame);

y establishing and pursuing a personal development plan, you will develop personal qualities such as self-awareness, confidence and resilience, and professional skills such as communication, teamwork, risk management, coaching and feedback. You will learn to construct outstanding CVs and professional LinkedIn profiles, and the module covers the Microsoft Office suite and digital skills of particular relevance to your discipline.", "This module is taught as a mix of lectures, practitioner guest lectures, hands-on skills seminars and computer lab sessions."], "International Financial Reporting": ["This module builds on the knowledge of financial accounting from Year 1 by requiring you to extend your understanding of double entry bookkeeping to the application of the International Financial Reporting Standards (IFRS). The approach to teaching the IFRS will be Framework-based, an approach recommended by the IASB, which develops a critical understanding of the well-established principles around corporate reporting.", "You will be taught from exercises and case studies that recount real life or lifelike business situations, presenting managers with a dilemma or uncertain outcome. This allows you to evaluate critically the appropriateness of certain accounting treatments and consider these within an ethical context."], "Research and Consultancy Skills": ["This module enables you to develop your understanding and competence in using diverse research methods for academic and professional purposes. You will develop practical qualitative and quantitative research skills including defining and scoping a project, designing a research protocol, collecting data and using appropriate analysis methods, with an appreciation of the ethical implications of research.", "You will also learn the key stages required to complete an applied project from concept to delivery: how to manage a project and contribute effectively as a member of a project team, using ideas generation techniques and equips you with the skills to exercise professional judgement in decision making and performance management in different business contexts. It builds on knowledge and skills developed in previous modules and introduces contemporary management accounting for strategic business decisions."], "Audit and Assurance": ["This module introduces the concepts of audit and assurance and the nature, role and purpose of the external audit function. You will develop your understanding of the principles and processes of the statutory audit and the regulatory framework, and consider the differences between internal and external audit.", "It also covers the audit of financial statements, including audit planning and risk assessment, materiality, evaluating internal controls, obtaining audit evidence and the statutory audit reporting process, and explores the contribution that audit makes to corporate governance."], "Strategic Leadership and Governance": ["Strategic leadership and good governance are integral components of a successful organisation. This module lets you explore the principles of strategic leadership and forms of governance, and their significance and impact.", "It also provides a critical insight into the challenges, theory and practice of corporate governance, and its importance to the accountant, in the appropriate theoretical, ethical and regulatory context."], "Digital Finance": ["This module covers the growing trend toward digitalisation in the financial sector, in both digital banking and non-bank financial services providers, and the challenges and opportunities it brings.", "Topics include blockchain technology, fintech, digital peer-to-peer funding platforms, distributed ledger business models and cryptocurrencies, as well as how the banking system and central banks are responding."]};
