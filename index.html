<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BA (Hons) Accounting and Finance course page</title>
<meta name="description" content="Course page design prototype for the University of Winchester, using BA (Hons) Accounting and Finance as the example.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Playfair+Display:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#291647}a:hover{color:#8f48d5}

.sec{scroll-margin-top:96px}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.hero-scroll{padding-bottom:40px}
.hero-media{position:sticky;top:20px;align-self:start;height:min(792px, 960px)}
@container page (max-width:899px){
.hero-row{grid-template-columns:1fr}
.hero-media{position:relative;top:0;order:-1;height:420px !important}
.cta-media{min-height:360px !important;order:-1}
.acc-row{grid-template-columns:1fr !important}
.two-col{grid-template-columns:1fr !important}
.cols-3,.cols-4,.cols-6{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.nav-links{display:none !important}
.h1{font-size:52px !important}
.h2{font-size:44px !important}
.jump-grid{grid-template-columns:1fr 1fr !important}
}
@container page (max-width:560px){
.cols-2,.cols-3,.cols-4,.cols-6,.jump-grid{grid-template-columns:1fr !important}
.pad{padding-left:16px !important;padding-right:16px !important}
.mod-row{flex-wrap:wrap}
}
</style>

<style>
html,body{height:100%}
body{background:#e4dcee;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{width:1280px;height:832px;flex:none;overflow-y:auto;overflow-x:hidden;background:#ffffff;container:page/inline-size;scroll-behavior:smooth;border-radius:8px;box-shadow:0 12px 40px rgba(41,22,71,.25);transform-origin:center center}
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="app"><noscript><p style="padding:40px;font-family:sans-serif">This prototype needs JavaScript to run.</p></noscript></div></div></div>
<template id="tpl">
<div style="font-family: Figtree, sans-serif; color: #291647; background: #ffffff; min-width: 0">
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><defs><clipPath id="cta-wave" clipPathUnits="objectBoundingBox"><path d="M0,0 L0.84,0 C0.9,0.14 0.96,0.28 1,0.4 L1,0.86 C0.72,0.84 0.42,0.87 0.2,1 L0,1 C0.07,0.72 0.07,0.28 0,0 Z"></path></clipPath><clipPath id="cta-wave-l" clipPathUnits="objectBoundingBox"><path d="M1,0 L0.16,0 C0.1,0.14 0.04,0.28 0,0.4 L0,0.86 C0.28,0.84 0.58,0.87 0.8,1 L1,1 C0.93,0.72 0.93,0.28 1,0 Z"></path></clipPath></defs></svg>

<!-- HERO -->
<header class="hero pad" style="background: #c68efd; padding: 20px 40px 40px">
  <nav aria-label="Main" style="max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 10px 10px 10px 16px; background: #291647; border-radius: 5px; min-height: 80px; box-sizing: border-box">
    <a href="#" aria-label="University of Winchester home" style="display: flex; align-items: center"><img src="images/logo.svg" alt="University of Winchester" style="height: 40px; width: auto; display: block"></a>
    <div class="nav-links" style="display: flex; gap: 20px; font-size: 16px; font-weight: 500">
      <a href="#" style="color: #ffffff; text-decoration: none">Study</a>
      <a href="#" style="color: #ffffff; text-decoration: none">Life at Winchester</a>
      <a href="#" style="color: #ffffff; text-decoration: none">Open days</a>
      <a href="#" style="color: #ffffff; text-decoration: none">Clearing</a>
    </div>
    <div style="display: flex; gap: 10px">
      <button type="button" style="min-height: 60px; padding: 0 18px; border: 0; border-radius: 5px; background: #c68efd; color: #291647; font: 500 16px Figtree, sans-serif; display: flex; align-items: center; gap: 10px; cursor: pointer">Menu <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#291647" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
      <button type="button" style="min-height: 60px; padding: 0 18px; border: 0; border-radius: 5px; background: #c68efd; color: #291647; font: 500 16px Figtree, sans-serif; display: flex; align-items: center; gap: 10px; cursor: pointer">Ask us anything <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#291647" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg></button>
    </div>
  </nav>


  <div class="hero-row" style="max-width: 1200px; margin: 20px auto 0">
    <div class="hero-scroll" style="display: flex; flex-direction: column; gap: 0; min-width: 0">
      <nav aria-label="Breadcrumb" style="margin: 56px 0 0">
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 16px; font-weight: 500">
          <li style="display: flex; align-items: center; gap: 10px"><a href="#" style="color: #291647; text-decoration: none">Study</a><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6d33b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></li>
          <li style="display: flex; align-items: center; gap: 10px"><a href="#" style="color: #291647; text-decoration: none">Undergraduate</a><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6d33b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></li>
        </ol>
      </nav>
      <h1 class="h1" style="margin: 14px 0 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 78px; line-height: 1.05; letter-spacing: -0.01em">Accounting and Finance</h1>
      <p style="margin: 40px 0 0; font-size: 35px; font-weight: 500; line-height: 1.2">BA (Hons)</p>
      <p style="margin: 48px 0 0; font-size: 20px; font-weight: 500; line-height: 1.6">From balance sheets to bold solutions.</p>
      <p style="margin: 12px 0 0; font-size: 18px; font-weight: 500; line-height: 1.6">Launch your finance career with a degree that looks beyond the spreadsheets. We'll equip you with professional qualifications while developing the human skills that employers truly value. Our award-nominated programme balances technical expertise with real-world application.</p>
      <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 48px">
        <a href="#apply" style="min-height: 60px; padding: 0 22px; border-radius: 5px; background: #291647; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; gap: 10px">{{ applyLabel }} <span aria-hidden="true">→</span></a>
        <a href="#open-days" style="min-height: 60px; padding: 0 22px; border-radius: 5px; border: 2px solid #291647; color: #291647; text-decoration: none; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; gap: 10px; box-sizing: border-box">Book an open day <span aria-hidden="true">→</span></a>
      </div>


      <dl style="margin: 56px 0 0; padding-top: 32px; border-top: 1px solid #8f48d5; display: flex; flex-direction: column; gap: 30px">
        <sc-for list="{{ facts }}" as="f" hint-placeholder-count="6">
          <div>
            <dt style="font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase">{{ f.label }}</dt>
            <dd style="margin: 8px 0 0; font-size: 24px; font-weight: 500; line-height: 1.4; display: flex; align-items: center; gap: 12px; flex-wrap: wrap"><span style="white-space: pre-line">{{ f.value }}</span><sc-if value="{{ f.hasTag }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 12px; background: #d4ef70; color: #291647; font-size: 12px; font-weight: 600">To confirm</span></sc-if></dd>
          </div>
        </sc-for>
      </dl>
    </div>

    <div class="hero-media" style="border-radius: 15px; overflow: hidden; background: #8f48d5">
      <img src="images/hero.jpg" alt="Two students walking past a stone wall on campus" style="width: 100%; height: 100%; object-fit: cover; object-position: 40% 50%; display: block">
      <button type="button" aria-label="Play video" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border: 0; border-radius: 5px; background: #291647; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="#ffffff"></path></svg></button>
    </div>
  </div>
</header>

<!-- ALERT -->
<div style="background: #d4ef70; padding: 18px 40px" class="pad">
  <p style="max-width: 1200px; margin: 0 auto; font-size: 16px; font-weight: 500">Next open day: Saturday 28 November 2026. <a href="#open-days" style="color: #291647; font-weight: 600">Book your place</a></p>
</div>

<!-- JUMP LINKS -->
<nav aria-label="On this page" style="position: sticky; top: 0; z-index: 20; background: #291647; color: #ffffff">
  <div class="pad" style="max-width: 1200px; margin: 0 auto; padding: 0 40px; min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 20px">
    <p style="margin: 0; font-size: 18px; font-weight: 500"><span style="color: #c68efd; font-size: 13px; font-weight: 600; margin-right: 12px">On this page</span>{{ currentLabel }}</p>
    <button type="button" aria-expanded="{{ jumpExpanded }}" onClick="{{ toggleJump }}" style="min-height: 48px; padding: 0 4px; border: 0; background: transparent; color: #ffffff; font: 500 18px Figtree, sans-serif; display: flex; align-items: center; gap: 10px; cursor: pointer">{{ jumpButton }} <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c68efd" stroke-width="1.8" aria-hidden="true" style="{{ chevronStyle }}"><circle cx="12" cy="12" r="10"></circle><path d="M8 10.5l4 4 4-4"></path></svg></button>
  </div>
  <sc-if value="{{ jumpOpen }}" hint-placeholder-val="{{ false }}">
    <div class="pad" style="max-width: 1200px; margin: 0 auto; padding: 8px 40px 32px">
      <ul class="jump-grid" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 20px">
        <sc-for list="{{ jumpLinks }}" as="j" hint-placeholder-count="12">
          <li><a href="{{ j.href }}" onClick="{{ j.close }}" style="{{ j.style }}">{{ j.label }}</a></li>
        </sc-for>
      </ul>
    </div>
  </sc-if>
  <div aria-hidden="true" style="height: 5px; background: #8f48d5"><div style="{{ progressStyle }}"></div></div>
</nav>

<main>

<!-- COURSE OVERVIEW -->
<section id="overview" class="sec pad" aria-labelledby="overview-h" style="padding: 80px 40px; border-bottom: 1px solid #e9e1f3">
  <div class="two-col" style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 387px minmax(0, 1fr); gap: 20px 60px">
    <h2 id="overview-h" class="h2" style="margin: 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 64px; line-height: 1.1">Course overview</h2>
    <div style="display: flex; flex-direction: column; gap: 18px; font-size: 18px; font-weight: 500; line-height: 1.6; color: #462b6d">
      <p style="margin: 0">Financial careers are evolving fast. While AI can handle the routine tasks, today's finance professionals need to be communicators, problem solvers, strategic advisors, and ethical decision-makers. Our programme prepares you for this reality.</p>
      <p style="margin: 0">From day one, you'll apply accounting principles to real scenarios from actual companies. This hands-on approach means you'll graduate ready to hit the ground running, not just with theoretical knowledge but practical experience that employers seek.</p>
      <p style="margin: 0">You'll benefit from our close-knit learning environment where lecturers know you by name and provide tailored guidance on your journey toward professional status. Many of our academics are qualified Chartered Accountants who bring current industry practices directly into the classroom.</p>
      <p style="margin: 0">Our degree offers exemptions from four professional accounting bodies, including the maximum exemption from up to nine papers from the Association of Chartered Certified Accountants (ACCA).</p>
    </div>
  </div>
</section>

<!-- WHY CHOOSE WINCHESTER -->
<section id="why" class="sec pad" aria-labelledby="why-h" style="padding: 80px 40px; border-bottom: 1px solid #e9e1f3">
  <div style="max-width: 1200px; margin: 0 auto">
    <h2 id="why-h" class="h2" style="margin: 0 0 48px; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 64px; line-height: 1.1">Why choose Winchester</h2>
    <div class="cols-6" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 32px 20px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="width: 80px; height: 80px; border-radius: 50%; background: #d4ef70; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#291647" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 26l7-7 5 5 12-12"></path><path d="M24 12h8v8"></path></svg></span>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">Fast-track to qualification</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #462b6d">Get a head start on your professional journey with our maximum 9 ACCA exemptions.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="width: 80px; height: 80px; border-radius: 50%; background: #d4ef70; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#291647" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="26" height="17" rx="1"></rect><circle cx="20" cy="29" r="3"></circle><path d="M14 36c1-3 3.5-4 6-4s5 1 6 4"></path></svg></span>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">Learn from industry experts</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #462b6d">Practising Chartered Accountants who know what employers want.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="width: 80px; height: 80px; border-radius: 50%; background: #d4ef70; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#291647" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="8" width="28" height="20" rx="1"></rect><path d="M11 23v-4M17 23v-8M23 23v-6M29 23v-10M14 34l6-6 6 6"></path></svg></span>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">Apply your knowledge</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #462b6d">To real financial challenges through case studies and industry simulations.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="width: 80px; height: 80px; border-radius: 50%; background: #d4ef70; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#291647" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 6l4.2 8.6 9.4 1.3-6.8 6.6 1.6 9.4L20 27.5l-8.4 4.4 1.6-9.4-6.8-6.6 9.4-1.3z"></path></svg></span>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">97% student satisfaction</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #462b6d">With the teaching and learning resources on this course.</p>
        <p style="margin: 0; font-size: 13px; color: #462b6d">National Student Survey 2026</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="width: 80px; height: 80px; border-radius: 50%; background: #d4ef70; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#291647" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="13" r="4"></circle><circle cx="27" cy="13" r="4"></circle><path d="M6 30c0-5 3.5-8 8-8s8 3 8 8M19 30c0-5 3.5-8 8-8s8 3 8 8"></path></svg></span>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">Network with employers</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #462b6d">Opportunities to connect at our finance-focused careers events.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="width: 80px; height: 80px; border-radius: 50%; background: #d4ef70; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#291647" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12h24v14H18l-6 5v-5H8z"></path><path d="M14 18h12M14 22h7"></path></svg></span>
        <h3 style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.25">Skills beyond the numbers</h3>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #462b6d">Develop the human side of accounting with communication, creativity and critical thinking.</p>
      </div>
    </div>
  </div>
</section>

<!-- APPLICATION ROUTE -->
<section id="apply" class="sec pad" aria-labelledby="apply-h" style="padding: 80px 40px; background: #f3e9ff">
  <div class="two-col" style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 387px minmax(0, 1fr); gap: 20px 60px">
    <div>
      <h2 id="apply-h" class="h2" style="margin: 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 64px; line-height: 1.1">How to apply</h2>
      <p style="margin: 20px 0 0; font-size: 18px; line-height: 1.6; color: #462b6d">How you apply depends on your fee status.</p>
      <p style="margin: 16px 0 0; font-size: 18px"><a href="#" style="color: #291647; font-weight: 600">How to apply for this course</a></p>
    </div>
    <div class="cols-2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
      <div style="{{ ukCardStyle }}">
        <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase">{{ ukCardTag }}</p>
        <h3 style="margin: 0; font-size: 26px; font-weight: 500">UK students</h3>
        <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #462b6d">Apply through UCAS using the course code NN34.</p>
        <a href="#" style="margin-top: auto; min-height: 56px; padding: 0 20px; border-radius: 5px; background: #291647; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; justify-content: space-between; gap: 10px">Apply now (for UK students) <span aria-hidden="true">→</span></a>
      </div>
      <div style="{{ intlCardStyle }}">
        <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase">{{ intlCardTag }}</p>
        <h3 style="margin: 0; font-size: 26px; font-weight: 500">International students</h3>
        <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #462b6d">Apply through our partner, Oxford International.</p>
        <a href="#" style="margin-top: auto; min-height: 56px; padding: 0 20px; border-radius: 5px; background: #291647; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; justify-content: space-between; gap: 10px">Apply now (for International students) <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </div>
</section>

<!-- COURSE STRUCTURE -->
<section id="modules" class="sec pad" aria-labelledby="modules-h" style="padding: 80px 40px; border-bottom: 1px solid #e9e1f3">
  <div style="max-width: 1200px; margin: 0 auto">
    <h2 id="modules-h" class="h2" style="margin: 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 64px; line-height: 1.1">Course structure</h2>
    <p style="margin: 20px 0 0; max-width: 820px; font-size: 18px; line-height: 1.6; color: #462b6d">Teaching is mainly lectures, seminars and workshops. Classes run between 9am and 6pm, Monday to Friday in term time, and Wednesday afternoons are kept free for personal study, sports clubs and societies.</p>
    <div class="two-col" style="background: #f3e9ff; border-radius: 15px; padding: 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; align-items: start; box-sizing: border-box; margin-top: 32px">
      <div role="tablist" aria-label="Year of study" style="display: flex; gap: 10px; overflow-x: auto; padding: 2px">
      <sc-for list="{{ yearTabs }}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" id="{{ t.id }}" aria-selected="{{ t.pressed }}" aria-controls="year-panel" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>
      <div id="year-panel" role="tabpanel" aria-labelledby="{{ yearTabId }}" style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; min-width: 0">
      <div>
        <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase">{{ year.eyebrow }}</p>
        <h3 style="margin: 12px 0 0; font-family: 'IvyPresto Display', 'Playfair Display', serif; font-weight: 400; font-size: 40px; line-height: 1.15">{{ year.heading }}</h3>
        <p style="margin: 16px 0 0; max-width: 820px; font-size: 17px; line-height: 1.6; color: #462b6d">{{ year.intro }}</p>
        <sc-if value="{{ yh.has }}" hint-placeholder-val="{{ true }}"><p style="margin: 12px 0 0; max-width: 820px; font-size: 17px; line-height: 1.6; color: #462b6d">Teaching, learning and assessment: {{ yh.teaching }} hours. Independent learning: {{ yh.independent }} hours.</p></sc-if>
        <sc-if value="{{ yh.has }}" hint-placeholder-val="{{ true }}">
          <div style="margin-top: 28px; padding-top: 24px; border-top: 1px solid #c68efd; display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-start">
            <div style="flex: 1 1 420px; max-width: 560px">
              <p style="margin: 0 0 12px; font-size: 14px; font-weight: 600">How you're assessed</p>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 24px">

<script>var SCROLLER = document.getElementById('frame'), FRAME_SCALE = 1; function fitFrame() { FRAME_SCALE = Math.min(1, (innerWidth - 32) / 1280, (innerHeight - 32) / 832); SCROLLER.style.transform = FRAME_SCALE < 1 ? 'scale(' + FRAME_SCALE + ')' : ''; } fitFrame(); addEventListener('resize', fitFrame);

    const DESC = {"Financial Accounting": ["This module aims to develop the fundamental concepts and practices of financial accounting and the application of this knowledge to different forms of business organisations. With a focus on using the IASB’s Conceptual Framework and accounting for transactions and events from first principles, you will develop your conceptual understanding of accounting, your knowledge of the main accounting terminology and your awareness of the nature and purpose of financial reporting.", "You will acquire the techniques of double entry accounting and how to apply its principles in recording transactions, adjusting financial records and preparing non-complex financial statements."], "Management Accounting": ["The module introduces management accounting as a specialised service function primarily involving the collection, storage and recording of financial data, its conversion to useful information and the effective communication of this information for decision making. It prepares you for more advanced aspects of management accounting and finance encountered later in the programme."], "The Business Environment": ["This module provides you with a holistic view of how an entity’s performance can be affected by both its own internal operating environment and the external environment. It develops your knowledge and skills in understanding and applying the legal principles in the context of the business environment, and in lawful and ethical behaviours for professional accountants.", "You will study various aspects of management theory, external environment mapping and uses of technology by businesses and finance professionals."], "Discovering Your Subject": ["Whatever your future career, there are certain professional skills that are required in the workplace. This module provides opportunities to acquire and apply essential skills for academic success, while also developing digital skills that are a prerequisite for a successful career.", "By establishing and pursuing a personal development plan, you will develop personal qualities such as self-awareness, confidence and resilience, and professional skills such as communication, teamwork, risk management, coaching and feedback. You will learn to construct outstanding CVs and professional LinkedIn profiles, and the module covers the Microsoft Office suite and digital skills of particular relevance to your discipline.", "This module is taught as a mix of lectures, practitioner guest lectures, hands-on skills seminars and computer lab sessions."], "International Financial Reporting": ["This module builds on the knowledge of financial accounting from Year 1 by requiring you to extend your understanding of double entry bookkeeping to the application of the International Financial Reporting Standards (IFRS). The approach to teaching the IFRS will be Framework-based, an approach recommended by the IASB, which develops a critical understanding of the well-established principles around corporate reporting.", "You will be taught from exercises and case studies that recount real life or lifelike business situations, presenting managers with a dilemma or uncertain outcome. This allows you to evaluate critically the appropriateness of certain accounting treatments and consider these within an ethical context."], "Research and Consultancy Skills": ["This module enables you to develop your understanding and competence in using diverse research methods for academic and professional purposes. You will develop practical qualitative and quantitative research skills including defining and scoping a project, designing a research protocol, collecting data and using appropriate analysis methods, with an appreciation of the ethical implications of research.", "You will also learn the key stages required to complete an applied project from concept to delivery: how to manage a project and contribute effectively as a member of a project team, using ideas generation techniques and problem-solving skills to develop innovative solutions to business problems."], "Financial Management": ["This module introduces the core concepts and key topic areas of business finance and the financial environment. It will enable you to understand how the financial markets operate, evaluate alternative sources of finance available to a business, and calculate the cost of different sources of finance and the weighted average cost of capital of a business.", "You will undertake and critique techniques for capital investment appraisals and business and financial asset valuation, and analyse critically the efficient market hypothesis, capital structure theories and dividend policies. This prepares you to study more advanced finance, such as financial risk management, in your final year."], "Data Analysis": ["An understanding of data and an appreciation of the key tools needed to analyse business data is becoming an essential skill for finance professionals. This module introduces you to data analytics and demonstrates how to apply it effectively in a business context.", "You will learn how to select and use tools to extract, validate and analyse data. Communicating and visualising data, for example with pie charts or cluster diagrams, is also covered, so you can share your findings with both specialists and non-specialists."], "Financial Modelling": ["This module aims to provide you with an understanding of Excel and its application in financial modelling. You will develop proficiency in using Excel, from the basic tools to advanced functions, and gain the skills needed to create financial models that accurately reflect a company’s financial performance, such as financial statements, valuation and sensitivity analysis."], "Personal and Business Taxation": ["This module develops your knowledge and understanding of the overall function and purpose of UK taxation in a modern economic context. You will learn how to calculate income tax, national insurance contributions, corporation tax, value added tax (VAT) and capital gains tax liabilities.", "You will also critically evaluate the scope and objectives of the UK tax system for individuals and business entities, including the implications of non-compliance and tax avoidance, and recognise the professional standards and ethical issues in a tax practice."], "Industrial Placement Year": ["This optional industrial placement year can be taken between your second and third year. It offers you the opportunity to undertake meaningful and relevant employment experience, in the form of a 30-week work placement.", "You will demonstrate the relevance of the work to your course and your competency in key skills, such as communication and team working. Applying your learning in the workplace integrates your academic study with meaningful employment experience."], "Advanced Financial Reporting and Analysis": ["This module extends your knowledge and application of IFRS to more detailed and complex areas of reporting. The technical content is mapped to professional qualification requirements, and you will need to pass this module to gain full exemptions.", "An inquiry guided approach supports you in analysing technical issues, creating valid approaches to reporting and critically evaluating the current IFRS. You will draw on technical articles and scholarly reviews to make informed judgements, and use analytical skills to interpret financial statement information."], "Investments and Financial Risk Management": ["This module develops an understanding of the key concepts of investments and financial risk management. It introduces the core investment principles and techniques that enable you to make informed investment decisions, including sustainable investing.", "It also develops your knowledge of the various types and nature of financial risk, and covers the main frameworks and techniques for the practical aspects of financial risk management."], "Strategic Performance Management": ["This module equips you with the skills to exercise professional judgement in decision making and performance management in different business contexts. It builds on knowledge and skills developed in previous modules and introduces contemporary management accounting for strategic business decisions."], "Audit and Assurance": ["This module introduces the concepts of audit and assurance and the nature, role and purpose of the external audit function. You will develop your understanding of the principles and processes of the statutory audit and the regulatory framework, and consider the differences between internal and external audit.", "It also covers the audit of financial statements, including audit planning and risk assessment, materiality, evaluating internal controls, obtaining audit evidence and the statutory audit reporting process, and explores the contribution that audit makes to corporate governance."], "Strategic Leadership and Governance": ["Strategic leadership and good governance are integral components of a successful organisation. This module lets you explore the principles of strategic leadership and forms of governance, and their significance and impact.", "It also provides a critical insight into the challenges, theory and practice of corporate governance, and its importance to the accountant, in the appropriate theoretical, ethical and regulatory context."], "Digital Finance": ["This module covers the growing trend toward digitalisation in the financial sector, in both digital banking and non-bank financial services providers, and the challenges and opportunities it brings.", "Topics include blockchain technology, fintech, digital peer-to-peer funding platforms, distributed ledger business models and cryptocurrencies, as well as how the banking system and central banks are responding."]};
    const CAPSTONE = [{"title": "", "text": "You must choose one of the four Capstone Project options."}, {"title": "Capstone Project: Dissertation", "text": "Draw on your learning across the programme and immerse yourself in a small-scale independent academic research project in an area of particular interest to you. You will author a substantial piece of structured academic work and gain a deeper understanding of credible and ethical management research."}, {"title": "Capstone Project: Placement for Good", "text": "Make a real difference to the community you live in. You will work in partnership with a host organisation in the private or public sector through a work placement, and carry out a strategic review of relevant CSR issues, with the aim of improving the alignment of the organisation’s activities to the UN 17 Sustainable Development Goals."}, {"title": "Capstone Project: Consultancy Project", "text": "Immerse yourself in a small-scale independent consultancy project, operating as a trainee management consultant for an external organisation or internal client. You will gain a deeper understanding of credible and ethical business consultancy and a broader insight into consultancy within the discipline."}, {"title": "Capstone Project: Start Up for Good", "text": "Work towards turning your pre-commercial idea into a successful, sustainable business, supported by a nine-month tenure within the Winchester Hatchery Incubator Programme. You will work with our enterprise and innovation experts to develop a viable start up with sustainability values at its core, aiming to register and launch the company."}];
    const M = (name, type, credits, sub) => ({ name, type, credits: credits + ' credits', parts: (name === 'Capstone Project' ? CAPSTONE : (DESC[name] || []).map((t) => ({ title: '', text: t }))).map((x) => ({ title: x.title, text: x.text, hasTitle: !!x.title })), typeStyle: 'display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; border-radius: 3px; font-size: 14px; font-weight: 500; ' + (type === 'Core' ? 'background: #291647; color: #ffffff;' : 'background: #ffffff; color: #291647; border: 1px solid #291647;') });
    const years = {

    const feeTabs = [['home', 'UK'], ['intl', 'International']].map(([k, l]) => ({ id: 'tab-fee-' + k, label: l, pressed: s.fee === k ? 'true' : 'false', style: tab(s.fee === k), pick: set({ fee: k }) }));

    const mkMore = (items) => items.map((x) => { const key = (intl ? 'i:' : 'u:') + x[0]; const open = s.openEntry === key; return { title: x[0], text: x[1], link: x[2], open: open, expanded: open ? 'true' : 'false', chevron: open ? 'transform: rotate(180deg); flex-shrink: 0' : 'flex-shrink: 0', toggle: () => this.setState({ openEntry: open ? null : key }) }; });
